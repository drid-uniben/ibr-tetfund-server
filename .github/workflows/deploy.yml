name: Deploy Container

on:
  push:
    branches: ["staging"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          IMAGE="ghcr.io/drid-uniben/ibr-tetfund-server"

          docker buildx build \
            --push \
            -t $IMAGE:${GITHUB_SHA} \
            -t $IMAGE:latest \
            -f Dockerfile \
            .